<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f4f4f1" />
<meta name="format-detection" content="telephone=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Toolbox" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
<script>
(() => {
  const key = "toolbox-theme-dashboard";
  const saved = localStorage.getItem(key);
  const mode = ["system", "dark", "light"].includes(saved) ? saved : "system";
  const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const effective = mode === "system" ? (systemDark ? "dark" : "light") : mode;
  document.documentElement.dataset.themeMode = mode;
  document.documentElement.dataset.theme = effective;
})();
</script>
<title>Toolbox</title>
<style>
:root{
  --bg:#f4f4f1;
  --card:#ffffff;
  --text:#181818;
  --muted:#6d6d68;
  --border:#deded8;
  --soft:#fafaf8;
  --hover-border:#9c9c96;
  --footer:#8b8b85;
  --shadow:0 10px 34px rgba(0,0,0,.06);
}
html[data-theme="dark"]{
  --bg:#171716;
  --card:#232321;
  --text:#f1f0ea;
  --muted:#aaa9a2;
  --border:#3b3b37;
  --soft:#2a2a27;
  --hover-border:#66665f;
  --footer:#8f8e87;
  --shadow:0 12px 36px rgba(0,0,0,.24);
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a,button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.theme-toggle{
  min-height:36px;
  border:0;
  padding:0 4px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:13px;
  white-space:nowrap;
}
.theme-toggle:active{color:var(--text)}
.wrap{
  width:min(820px,calc(100% - 28px));
  margin:0 auto;
  padding:
    calc(28px + env(safe-area-inset-top))
    0
    calc(42px + env(safe-area-inset-bottom));
}
.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}
.brand{
  min-width:0;
}
.eyebrow{
  text-transform:uppercase;
  letter-spacing:.18em;
  font-size:11px;
  color:var(--muted);
  margin-bottom:5px;
}
h1{
  margin:0;
  font-size:29px;
  letter-spacing:-.55px;
  line-height:1.05;
}
.sub{
  margin-top:9px;
  color:var(--muted);
  font-size:14px;
  line-height:1.45;
}
.grid{
  margin-top:23px;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.card{
  display:block;
  text-decoration:none;
  color:inherit;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  min-height:132px;
  box-shadow:var(--shadow);
  transition:transform .15s ease,border-color .15s ease;
}
.card:active{transform:scale(.99)}
@media(hover:hover){
  .card:hover{transform:translateY(-1px);border-color:var(--hover-border)}
}
.top{
  display:flex;
  justify-content:space-between;
  gap:14px;
  align-items:flex-start;
}
.title{font-size:18px;font-weight:760}
.desc{
  margin-top:6px;
  color:var(--muted);
  font-size:14px;
  line-height:1.45;
}
.badge{
  border:1px solid var(--border);
  border-radius:999px;
  padding:6px 9px;
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
  background:var(--soft);
}
.flow{
  margin-top:24px;
  color:var(--muted);
  font-size:12px;
}
.footer{
  margin-top:22px;
  text-align:center;
  color:var(--footer);
  font-size:11px;
}
@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  .wrap{
    width:min(100% - 24px,820px);
    padding-top:calc(20px + env(safe-area-inset-top));
  }
}
</style>
</head>
<body>
<main class="wrap">
  <div class="header-row">
    <div class="brand">
      <div class="eyebrow">Personal</div>
      <h1>Toolbox</h1>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button">◐ System</button>
  </div>
  <div class="sub">Small tools for everyday things.</div>

  <section class="grid">
    <a class="card" href="./price-tools.html">
      <div class="top">
        <div>
          <div class="title">Price Tools</div>
          <div class="desc">Compare unit prices or calculate effective prices from common discounts.</div>
        </div>
        <div class="badge">Everyday</div>
      </div>
      <div class="flow">Compare prices ↔ Calculate discounts</div>
    </a>

    <a class="card" href="./random-picker.html">
      <div class="top">
        <div>
          <div class="title">Random Picker</div>
          <div class="desc">Let chance decide when every option feels possible.</div>
        </div>
        <div class="badge">Everyday</div>
      </div>
      <div class="flow">Add options → Pick → Decide</div>
    </a>
  </section>

  <div class="footer">Toolbox · 1.2</div>
</main>

<script>

(() => {
  const THEME_KEY = "toolbox-theme-dashboard";
  const MODES = ["system", "dark", "light"];
  const LABELS = {
    system: "◐ System",
    dark: "☾ Dark",
    light: "☀︎ Light"
  };
  const media = window.matchMedia("(prefers-color-scheme: dark)");
  const button = document.getElementById("themeToggle");
  const themeMeta = document.querySelector('meta[name="theme-color"]');

  function storedMode() {
    const saved = localStorage.getItem(THEME_KEY);
    return MODES.includes(saved) ? saved : "system";
  }

  function effectiveTheme(mode) {
    return mode === "system" ? (media.matches ? "dark" : "light") : mode;
  }

  function applyTheme(mode, save = false) {
    if (!MODES.includes(mode)) mode = "system";
    const effective = effectiveTheme(mode);

    document.documentElement.dataset.themeMode = mode;
    document.documentElement.dataset.theme = effective;
    document.documentElement.style.colorScheme = effective;

    if (button) {
      button.textContent = LABELS[mode];
      button.setAttribute("aria-label", `Theme: ${mode}. Tap to change.`);
      button.title = `Theme: ${mode}`;
    }

    if (themeMeta) {
      themeMeta.setAttribute("content", effective === "dark" ? "#171716" : "#f4f4f1");
    }

    if (save) {
      localStorage.setItem(THEME_KEY, mode);
    }
  }

  button?.addEventListener("click", () => {
    const current = document.documentElement.dataset.themeMode || storedMode();
    const next = MODES[(MODES.indexOf(current) + 1) % MODES.length];
    applyTheme(next, true);
  });

  media.addEventListener?.("change", () => {
    if ((document.documentElement.dataset.themeMode || storedMode()) === "system") {
      applyTheme("system", false);
    }
  });

  applyTheme(storedMode(), false);
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js", { scope: "./" })
      .then(registration => registration.update())
      .catch(error => console.warn("Service worker registration failed:", error));
  });
}
</script>
</body>
</html>
